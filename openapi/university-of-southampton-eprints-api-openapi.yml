info:
  title: Soton REST Interface Eprints API
  version: '2.0'
  x-generated: '2026-08-30'
  x-method: derived
  x-source: Derived from live probes of https://eprints.soton.ac.uk/rest/ on 2026-08-30. The dataset index, the eprint dataset listing and a single-record retrieval were each exercised against the running service. A captured record is held in examples/eprints-rest-eprint-498754.xml. The University publishes no OpenAPI description of this interface; this document is API Evangelist's.
  x-operator: institution
  x-operator-evidence: 'Same host and same evidence as the OAI-PMH surface: eprints.soton.ac.uk resolves to 152.78.118.18 in the University''s own address space, and the platform is EPrints 3.3.15, software developed at the University of Southampton itself.'
  description: The EPrints REST interface exposed by ePrints Soton, the University of Southampton's institutional research repository.
  contact:
    name: ePrints Soton
