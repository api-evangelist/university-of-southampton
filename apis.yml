- aid: university-of-southampton:eprints-oai-pmh
  name: ePrints Soton OAI-PMH Interface
  description: |-
    Live, open OAI-PMH 2.0 metadata harvesting for ePrints Soton, the University's institutional research repository. Verified 2026-08-30: Identify returned repositoryName 'ePrints Soton', repositoryIdentifier eprints.soton.ac.uk, adminEmail eprints@soton.ac.uk, earliestDatestamp 2021-12-11T15:30:50Z, deletedRecord 'persistent' and granularity to the second; ListMetadataFormats offered eight prefixes including rioxx (RIOXX v2.0, the UK research-output profile), uketd_dc, mets, didl and rdf; ListSets and GetRecord both returned real data. Records carry ORCID iDs and institution-minted DataCite DOIs under the University's own 10.5258 prefix. The repository's metadataPolicy grants free re-use of metadata in any medium for not-for-profit purposes with attribution.

    Correction to the previous profile: this endpoint was recorded as returning HTTP 403 and presumed to be filtering automated requests. That was a probe artifact. The host runs Anubis 1.24.0, which challenges browser-like User-Agent strings with 401 and denies crawler agents such as Googlebot with 403, but serves plain and harvester User-Agents normally with 200. The endpoint is live and fully functional.
  humanURL: https://eprints.soton.ac.uk/
  baseURL: https://eprints.soton.ac.uk/cgi/oai2
