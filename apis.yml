- aid: university-of-southampton:eprints-rest
  name: ePrints Soton REST Interface
  description: >-
    Read-only REST interface over the ePrints Soton data model, exposing the repository's eprint, user
    and subject datasets. Unauthenticated. Individual records dereference by identifier with a format
    extension and return native EPrints XML (namespace http://eprints.org/ep2/data/2.0) including nested
    documents and files with their own stable identifiers. Verified 2026-08-30: the dataset index returned
    200 (524 bytes) and eprint 498754 returned 200 text/xml (5106 bytes) carrying populated ORCID iDs
    and the DOI 10.5258/SOTON/WSI-WP013. Treat it as a repository export rather than a designed API —
    there is no pagination, versioning, rate-limit header or published contract, and the unfiltered listing
    at /rest/eprint/ streamed past 11 MB without completing at a 25-second timeout. Use OAI-PMH for bulk
    work. Same Anubis User-Agent gate as the OAI-PMH surface.
  humanURL: https://eprints.soton.ac.uk/
  baseURL: https://eprints.soton.ac.uk/rest
