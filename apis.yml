- aid: university-of-southampton:figshare-tenancy
  name: Figshare research data repository tenancy
  description: >-
    The University's tenancy of Figshare for research data, at southampton.figshare.com. Live and reachable
    but fronted by an AWS WAF bot challenge — HTTP 202 with header x-amzn-waf-action:challenge and a zero-length
    body on 2026-08-30, which is live and blocked, not dead. The data and the DOIs are Southampton's;
    the API is Figshare's generic v2 contract, shared by every customer, and it is deliberately not held
    under this slug. This is the exact misattribution the university pipeline exists to prevent: one Figshare
    contract was previously attributed to twenty-five institutions across this cohort.
