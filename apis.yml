- aid: university-of-southampton:shibboleth-saml-idp
  name: Shibboleth SAML Identity Provider (UK Access Management Federation)
  description: >-
    The University's own Shibboleth 3.x Identity Provider, entityID https://webauth.soton.ac.uk/shibboleth,
    asserting shibmd:Scope soton.ac.uk. Its entity descriptor is published both by the IdP itself and,
    signed, through the Jisc UK Access Management Federation MDQ service and onward into eduGAIN — retrieved
    live on 2026-08-30 (200, application/xml, 16951 bytes direct; 200, application/samlmetadata+xml, 19396
    bytes signed) and saved to this repo. Carries IDPSSODescriptor, AttributeAuthorityDescriptor and SPSSODescriptor
    roles, advertising SAML 2.0, SAML 1.1 and the native urn:mace:shibboleth:1.0 profile over HTTP-Redirect,
    HTTP-POST and HTTP-POST-SimpleSign SSO and SLO bindings, with SOAP AttributeQuery and ArtifactResolution
    on port 8443. Institution-operated by definition and the most under-catalogued programmable asset
    a university runs. Note this is not a public developer API: an application cannot obtain an assertion
    without first being registered as a service provider in the federation, so there is no self-service
    path.
  humanURL: https://www.southampton.ac.uk/isolutions/
  baseURL: http://mdq.ukfederation.org.uk/entities/https%3A%2F%2Fwebauth.soton.ac.uk%2Fshibboleth
