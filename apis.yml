apis:
- aid: university-of-southampton:open-data-linked-data
  name: University of Southampton Open Data Service (Linked Data)
  description: >-
    Institution-built, institution-hosted linked open data covering the physical and organisational University:
    buildings and sites, term dates, organisational structure, research facilities, points of service,
    products and services, bus information, printers, workstation clusters and opening hours, room bookings,
    room features and shapes, and the University timetable — twenty-two datasets in all. Persistent URIs
    live under http://id.southampton.ac.uk/{class}/{id} and redirect to representations on data.southampton.ac.uk,
    where any generated page is available in machine-readable form by swapping the format extension: .ttl,
    .rdf, .nt, with .csv, .kml, .ics and RSS where the data suits them. Each dataset also offers a bulk
    dump at /dataset/{id}/latest.{ext}. A DCAT catalogue describes the whole service and asserts the Open
    Government Licence and five-star open linked data conformance. Verified live on 2026-08-30: building
    94A returned 200 text/turtle (2329 bytes) and 200 application/rdf+xml (2354 bytes), the DCAT catalogue
    returned 200 (4244 bytes), and negative probes against real path shapes returned genuine 404s rather
    than soft-200s. Caveat: the catalogue's VoID description still advertises void:sparqlEndpoint at sparql.data.southampton.ac.uk,
    which is retired.
  humanURL: https://data.southampton.ac.uk/
  baseURL: https://data.southampton.ac.uk/
