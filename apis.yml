  detail: |-
    Four institution-operated surfaces found and verified by live probe on 2026-08-30, and three contracts written from those probes and saved. Southampton is a genuine outlier in this cohort: its principal surfaces are its own engineering, not a supplier's. The Open Data Service (data.southampton.ac.uk / id.southampton.ac.uk, both in the University's own JANET address space) publishes twenty-two datasets as five-star linked data under the Open Government Licence, with content negotiation exercised end to end rather than merely linked. The Shibboleth 3.x SAML 2.0 Identity Provider (entityID https://webauth.soton.ac.uk/shibboleth, scope soton.ac.uk) was retrieved both from the IdP itself and, signed, from the Jisc UK Access Management Federation MDQ service; it was entirely absent from the previous profile and is the single largest addition of this run. ePrints Soton offers a live OAI-PMH 2.0 interface with eight metadata formats and a read REST interface, on the institution's own host running EPrints 3.3.15 — software developed at Southampton, so uniquely in this cohort the repository platform is not a vendor's either.

    Two surfaces are real but tenant-operated and are recorded as relationships without holding the supplier's specification: the Elsevier Pure CRIS tenancy (pure.soton.ac.uk CNAME soton.elsevierpure.com) and the Figshare research data tenancy (southampton.figshare.com CNAME figshare.com). Southampton's Pure tenancy is more closed than several peers': /ws/oai and /ws/api both return 403.

    One previously claimed surface was withdrawn as dead. sparql.data.southampton.ac.uk was recorded as the institution's flagship public SPARQL endpoint; it is decommissioned and returns HTTP 200 with the body "Sorry, We no longer off a public SPARQL interface to Southampton Open Data" for every method and scheme. It is a soft-200, invisible to status-code monitoring, and the Open Data catalogue's own VoID metadata still advertises it via void:sparqlEndpoint. One further stale claim was corrected: the OAI-PMH endpoint was recorded as returning 403, which was a probe artifact of a browser User-Agent hitting the host's Anubis bot challenge, not a property of the service.

    Six of the twelve education-regime domain standards are evidenced with live probes — oai-pmh, shibboleth, saml, orcid, datacite (6,735 DOIs under the University's own prefix 10.5258) and crossref (member 9786, prefix 10.22493). The profile is thin in the places universities are genuinely thin: no central developer portal, no api.southampton.ac.uk or developer.soton.ac.uk (neither resolves), no public course or registrar API (timetable.soton.ac.uk is behind Microsoft Entra ID), and no research-computing surface — iridis.soton.ac.uk returns 200 but serves an unconfigured default WordPress installation and was rejected as a placeholder. No surface publishes a version, changelog, status page or deprecation signal.
