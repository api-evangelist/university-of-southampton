apis:
  - aid: university-of-southampton:open-data-sparql
    name: Open Data Service SPARQL Endpoint
    description: >-
      Public SPARQL query endpoint for the University of Southampton Open Data
      Service, backed by a triple store (Sesame) with an arc2 front end. Allows
      querying of campus, building, organizational, catalogue, and facilities
      linked data.
    humanURL: https://data.southampton.ac.uk/
    baseURL: https://sparql.data.southampton.ac.uk/
    tags: [ Open Data, Linked Data, SPARQL, RDF ]
    properties:
      - type: Documentation
        url: https://www.data.southampton.ac.uk/faq.html
      - type: GitHub
        url: https://github.com/southampton
  - aid: university-of-southampton:open-data-linked-data
    name: Open Data Linked Data (RDF) Service
    description: >-
      Linked open data published at data.southampton.ac.uk. Resource pages
      offer machine-readable representations via content negotiation and
      "get the data" links in RDF/XML (.rdf), Turtle (.ttl), N-Triples (.nt),
      and where relevant CSV, KML, ICS, and RSS.
    humanURL: https://data.southampton.ac.uk/
    baseURL: https://data.southampton.ac.uk/
    tags: [ Open Data, Linked Data, RDF, Campus ]
    properties:
      - type: Documentation
        url: https://www.data.southampton.ac.uk/faq.html
      - type: GitHub
        url: https://github.com/southampton
  - aid: university-of-southampton:eprints-oai-pmh
    name: ePrints Soton OAI-PMH Interface
    description: >-
      OAI-PMH metadata harvesting interface for ePrints Soton, the University's
      institutional research repository, built on the EPrints platform
      (originally developed at Southampton). The repository is read-only for
      search and harvesting; new deposits now go through Pure. Note: a direct
      probe of the OAI-PMH endpoint returned HTTP 403 (likely automated-request
      filtering); the interface is documented and intended for repository
      harvesters.
    humanURL: https://eprints.soton.ac.uk/
    baseURL: https://eprints.soton.ac.uk/cgi/oai2
    tags: [ OAI-PMH, Repository, Research, Metadata, EPrints ]
    properties:
      - type: Documentation
        url: https://eprints.soton.ac.uk/
