aid: university-of-southampton
name: University of Southampton
description: |-
  The University of Southampton is a public research university in Southampton, United Kingdom, a founding member of the Russell Group and one of the few institutions in this cohort whose programmable footprint is genuinely its own engineering rather than a supplier's contract running under its name.

  Four institution-operated surfaces were found and verified by live probe on 2026-08-30. The University of Southampton Open Data Service at data.southampton.ac.uk, with persistent identifiers under id.southampton.ac.uk, publishes twenty-two datasets of campus, building, organisational, catalogue, transport and facilities data as five-star linked data under the Open Government Licence, reachable by content negotiation in Turtle, RDF/XML and N-Triples and by bulk dump per dataset. It is institution-built on tooling Southampton wrote, and it covers the campus-life and timetable classes that universities operate and almost never publish. The University runs its own Shibboleth 3.x SAML 2.0 Identity Provider, entityID https://webauth.soton.ac.uk/shibboleth, scope soton.ac.uk, registered in the Jisc UK Access Management Federation and reachable through eduGAIN. ePrints Soton, the institutional research repository, exposes a live open OAI-PMH 2.0 interface offering eight metadata formats including RIOXX v2.0, plus a read REST interface over the EPrints data model; the platform is EPrints 3.3.15, software developed at Southampton itself, so uniquely in this cohort neither the host nor the repository software belongs to a vendor. The University is a DataCite member in its own right with 6,735 DOIs minted under its own prefix 10.5258, and a Crossref member under prefix 10.22493.

  Two further surfaces are real but tenant-operated and are recorded as relationships without holding the supplier's specification: the Elsevier Pure CRIS tenancy at pure.soton.ac.uk, which is now the system of record for research deposit and whose public web services are switched off, and the Figshare research data tenancy at southampton.figshare.com.

  One prominent claim in the previous profile of this institution is now false and has been withdrawn. The public SPARQL endpoint at sparql.data.southampton.ac.uk is decommissioned: it answers every request with HTTP 200 and the body "Sorry, We no longer off a public SPARQL interface to Southampton Open Data", and the Open Data catalogue's own VoID metadata still advertises it. There is no central developer portal, no api.southampton.ac.uk and no public course, registrar or research-computing API. Access across the estate is open and standards-based rather than key-gated, and no surface publishes a version, changelog, status page or deprecation signal.
