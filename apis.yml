---
aid: university-of-southampton
name: University of Southampton
description: >-
  The University of Southampton is a public research university in Southampton,
  United Kingdom, ranked #70 in the QS World University Rankings 2025. It is a
  founding member of the Russell Group and a recognized pioneer of open and
  linked data in higher education. Its developer/API footprint is centered on
  the University of Southampton Open Data Service (data.southampton.ac.uk),
  which publishes campus, building, organizational, catalogue, and facilities
  data as linked data with a public SPARQL endpoint and multiple
  machine-readable formats (RDF/XML, Turtle, N-Triples, CSV, KML, ICS). The
  University is also the home of the EPrints open-source repository platform;
  its institutional research repository (ePrints Soton) exposes an OAI-PMH
  metadata harvesting interface. There is no single unified commercial API
  developer portal; access is open and standards-based rather than
  key-gated.
