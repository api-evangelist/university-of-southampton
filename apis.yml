  audit_script_caveat: >-
    audit-university-contracts.py reported this repo as {institution:2, unknown:1} with no tenant hosts,
    because its verdict is host-name based and the repo held no vendor contracts to catch. Two blind spots
    showed up here. First, it cannot see a vanity CNAME: pure.soton.ac.uk looks institutional and points
    at soton.elsevierpure.com, and the tenant relationships it missed were found by DNS. Second, and more
    important for this cohort, a host-based verdict cannot see that a host is DEAD — sparql.data.southampton.ac.uk
    was classified institution and is a decommissioned service answering 200. The x-operator values in
    this file are set from DNS plus each surface's own self-declaration, and liveness from a real request
    against the surface's own protocol, not from the script.
