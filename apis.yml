- aid: university-of-southampton:pure-cris-tenancy
  name: Elsevier Pure CRIS tenancy
  description: |-
    The University's tenancy of Elsevier Pure, its Current Research Information System, at pure.soton.ac.uk. Pure is now the system of record: researchers deposit into Pure and outputs flow onward to ePrints Soton for public display, and the University states ePrints is no longer available for login or deposit. All of that is Southampton's data and Southampton's administration on Elsevier's platform under Elsevier's contract, so it is recorded here as a relationship and the supplier's specification is not held under this slug.

    Unlike several peers in this cohort, this tenancy exposes no public web services: both /ws/oai and /ws/api returned HTTP 403 from an Elsevier-branded error page on 2026-08-30, and the portal itself redirects to Microsoft Entra ID SAML sign-in for the University's tenant. The migration of deposit from ePrints to Pure has therefore reduced the institution's public programmable surface rather than increased it.
