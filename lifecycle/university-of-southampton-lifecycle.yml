- surface: Open Data Service — public SPARQL endpoint
  status: retired
  x-operator: institution
  detail: >-
    Decommissioned. Retired without an HTTP deprecation signal: the host answers every request
    method with HTTP 200 and a prose notice rather than 410 Gone, and no Deprecation or Sunset
    header is present. The catalogue's own VoID metadata still asserts
    void:sparqlEndpoint <http://sparql.data.southampton.ac.uk/>, so the retirement is not reflected
    in the machine-readable description of the service. This is the clearest lifecycle defect on
    the provider and it is invisible to any status-code-based monitor.
  evidence:
  - location: https://sparql.data.southampton.ac.uk/
    status: 200
    detail: >-
      Body reads "Sorry, We no longer off a public SPARQL interface to Southampton Open Data".
